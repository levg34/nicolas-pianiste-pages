name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag pages:latest

    - name: Save Docker image
      run: docker save -o pages.tar pages:latest

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v7
      with:
        name: pages-image
        path: pages.tar
        retention-days: 7
